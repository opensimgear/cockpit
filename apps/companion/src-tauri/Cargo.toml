[package]
name = "osg-companion"
version = "0.1.0"
description = "OpenSimGear paired portable controller panel companion"
authors = ["OpenSimGear"]
edition = "2021"
rust-version = "1.90"
license-file = "../../../LICENSE"
default-run = "osg-companion"

[lib]
name = "osg_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
osg-companion-service = { path = "../../../crates/companion-service" }
serde_json = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-companion-platform = { path = "../../../crates/companion-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_StationsAndDesktops"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
