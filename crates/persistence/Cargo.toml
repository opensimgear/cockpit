[package]
name = "osg-persistence"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
