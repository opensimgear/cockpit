[package]
license-file = "../../LICENSE"
name = "osg-controller-input"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
osg-persistence = { path = "../persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "=0.13.2"
udev = "=0.9.3"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
iohidmanager = { version = "=0.11.0", default-features = false }

[dev-dependencies]
osg-persistence = { path = "../persistence", features = ["test-support"] }
