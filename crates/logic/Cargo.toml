[package]
name = "osg-logic"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
[dependencies]
osg-mapping = { path = "../mapping" }
rhai = { version = "=1.26.1", default-features = false, features = ["std", "serde", "no_module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
