[package]
name = "tauri-plugin-companion-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"
links = "tauri-plugin-companion-platform"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }
osg-companion-service = { path = "../companion-service" }
