[package]
name = "osg-profiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
osg-mapping = { path = "../mapping" }
