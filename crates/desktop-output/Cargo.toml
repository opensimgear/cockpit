[package]
name = "osg-desktop-output"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[dependencies]
osg-persistence = { path = "../persistence" }
osg-mapping = { path = "../mapping" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[dev-dependencies]
osg-persistence = { path = "../persistence", features = ["test-support"] }
