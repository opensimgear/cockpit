[package]
name = "osg-companion-serial"
version = "0.1.0"
edition = "2021"
license-file = "../../LICENSE"

[dependencies]
osg-companion-service = { path = "../companion-service" }
serialport = { version = "4.8", default-features = false }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
espflash = { version = "=4.1.0", default-features = false, features = ["serialport"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
osg-companion-service = { path = "../companion-service", features = ["legacy-test-fixtures"] }
