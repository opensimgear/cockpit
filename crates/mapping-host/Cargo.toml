[package]
license-file = "../../LICENSE"
name = "osg-mapping-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
[features]
legacy-test-fixtures = ["osg-companion-service/legacy-test-fixtures"]
[dependencies]
osg-companion-service = { path = "../companion-service" }
osg-logic = { path = "../logic" }
osg-mapping = { path = "../mapping" }
osg-desktop-output = { path = "../desktop-output" }
osg-controller-input = { path = "../controller-input" }
osg-virtual-controller = { path = "../virtual-controller" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
osg-companion-service = { path = "../companion-service", features = ["legacy-test-fixtures"] }
