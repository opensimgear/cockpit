[package]
name = "osg-mapping-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
[dependencies]
osg-mapping = { path = "../mapping" }
osg-controller-input = { path = "../controller-input" }
osg-virtual-controller = { path = "../virtual-controller" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
