[package]
name = "osg-virtual-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
osg-mapping = { path = "../mapping" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_LibraryLoader", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_Security"] }
