[package]
name = "osg-companion-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
zeroize = "1"
subtle = "2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto", "pem", "x509-parser"] }
tungstenite = "0.28"
x509-parser = "0.18"
mdns-sd = "0.17"
qrcode = { version = "0.14", default-features = false }
time = "0.3"
if-addrs = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
