[package]
name = "osg-companion-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license-file = "../../LICENSE"

[features]
# Explicit lower-level legacy fixture admission for transport/storage tests only.
# Public publication validation and IPC remain compiled-only with this enabled.
legacy-test-fixtures = []

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
zeroize = "1"
ring = "0.17"
subtle = "2"
spake2 = "0.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto", "pem", "x509-parser"] }
tungstenite = "0.28"
x509-parser = "0.18"
mdns-sd = "0.17"
qrcode = { version = "0.14", default-features = false }
time = "0.3"
if-addrs = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
osg-companion-service = { path = ".", features = ["legacy-test-fixtures"] }
