name: Mobile checks and build artifacts
on:
  workflow_call:
    inputs:
      include_signed_ios: { type: boolean, required: false, default: false }
  workflow_dispatch:
    inputs:
      include_signed_ios:
        description: Build the signed iOS device package when signing secrets are configured.
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm companion:check
      - run: pnpm --filter @opensimgear/companion check
      - run: pnpm --filter '@opensimgear/companion-*' test
      - run: pnpm --filter @opensimgear/companion test
      - run: pnpm companion:ui:build
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config dbus-x11 gnome-keyring
      - run: python3 -m unittest discover -s scripts -p 'test_companion_mobile*.py' -v
      - name: Native protocol and client tests
        run: |
          # The host TLS persistence test uses the real protected Secret Service store.
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "ephemeral-ci-keyring" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --manifest-path crates/companion-service/Cargo.toml
          '

  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and Rust target
        run: |
          rustup target add aarch64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opensimgear/companion tauri android init --ci
      - name: Install the platform requested by the generated Tauri project
        run: |
          platform="$(python3 scripts/companion-mobile-build.py android-platform)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$platform" "platforms;android-36"
          test -f "$ANDROID_HOME/platforms/${platform#*;}/android.jar"
      - name: Build development APK
        run: pnpm --filter @opensimgear/companion tauri android build --debug --apk --target aarch64 --ci -- --locked
      - name: Collect development APK
        run: python3 scripts/companion-mobile.py android-debug
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: .research/mobile-release/*.apk
          if-no-files-found: error
  ios-simulator:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup target add aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opensimgear/companion tauri ios init --ci
      - name: Use the installed CLI directly in the generated Xcode Rust hook
        run: python3 scripts/companion-mobile-build.py ios-rust-hook
      - run: pnpm --filter @opensimgear/companion tauri ios build --debug --target aarch64-sim --no-sign --ci -- --locked
      - name: Package simulator app bundle (not installable on devices)
        run: python3 scripts/companion-mobile.py ios-simulator
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-simulator
          path: .research/mobile-release/*.tar.gz
          if-no-files-found: error
  ios-device:
    if: github.ref == 'refs/heads/main' && inputs.include_signed_ios && vars.IOS_SIGNING_ENABLED == 'true'
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate signing configuration
        run: |
          test -n "$APPLE_DEVELOPMENT_TEAM"
          test -n "$IOS_CERTIFICATE"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_MOBILE_PROVISION"
      - run: rustup target add aarch64-apple-ios
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @opensimgear/companion tauri ios init --ci
      - name: Use the installed CLI directly in the generated Xcode Rust hook
        run: python3 scripts/companion-mobile-build.py ios-rust-hook
      - run: pnpm --filter @opensimgear/companion tauri ios build --target aarch64 --ci --export-method app-store-connect --build-number "${{ github.run_number }}" -- --locked
      - run: python3 scripts/companion-mobile.py ios-device
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-device
          path: .research/mobile-release/*.ipa
          if-no-files-found: error
