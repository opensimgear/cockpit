name: ESP32 companion foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Link shared source packages for independent projection oracles
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Designer publication export compatibility and coverage
        run: node --experimental-test-coverage --test-coverage-include=apps/companion-esp32/tools/export-panel.mjs --test-coverage-lines=71 --test-coverage-branches=71 --test-coverage-functions=71 --test apps/companion-esp32/test/export.test.mjs
      - name: Native network test dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libssl-dev
      - name: Network protocol, live input, lease and provisioning checks
        run: |
          python3 apps/companion-esp32/test/network.py
          python3 apps/companion-esp32/test/storage.py
          python3 apps/companion-esp32/test/serial.py
          python3 -m unittest discover -s apps/companion-esp32/test -p "provision_test.py" -v
      - name: Sunton shared-SPI display and touch fault injection
        run: python3 apps/companion-esp32/test/sunton.py
      - name: Waveshare driver fault injection and coverage
        run: python3 apps/companion-esp32/test/waveshare.py
      - name: Native firmware sanitizers, coverage and preview
        run: python3 apps/companion-esp32/test/run.py
      - name: Locked LVGL shared-source states, partial buffers, failure recovery and coverage
        run: python3 apps/companion-esp32/test/lvgl.py
      - name: Bounded render content, binary structure and modeled power-cut recovery
        run: |
          python3 apps/companion-esp32/test/package.py
          python3 apps/companion-esp32/test/content_store.py
      - name: Portable widget source admission, immutable ownership and differential validation
        run: |
          node scripts/widget-source-fixtures.mjs --check
          python3 apps/companion-esp32/test/widget_source.py
          node scripts/widget-state-fixtures.mjs --check
          python3 apps/companion-esp32/test/widget_state.py
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-portable-evidence
          path: |
            .research/esp32-native/coverage.json
            .research/esp32-native/preview.png
            .research/lvgl-native/coverage.json
            .research/lvgl-native/*.png
            .research/esp32-content-store-native/coverage.json
            .research/esp32-content-store-native/content-store-test.log
            .research/esp32-render-package-native/coverage.json
            .research/esp32-render-package-native/package-test.log
            .research/esp32-widget-source-native/coverage.json
            .research/esp32-widget-source-native/widget-source-test.log
            .research/esp32-widget-state-native/coverage.json
            .research/esp32-widget-state-native/widget-state-test.log
            .research/esp32-network/coverage.json
            .research/esp32-serial/coverage.json
            .research/esp32-network/*-test.log
            .research/esp32-waveshare-native/coverage.json
            .research/esp32-waveshare-native/board-test.log
  cross-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cross-build network firmware with headless display with pinned SDK
        run: |
          docker run --rm -v "$PWD:/project" -w /project/apps/companion-esp32 espressif/idf:v5.5.2 idf.py -B build-${{ matrix.target }} -DIDF_TARGET=${{ matrix.target }} -DSDKCONFIG=build-${{ matrix.target }}/sdkconfig build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-headless-${{ matrix.target }}
          path: |
            apps/companion-esp32/build-${{ matrix.target }}/*.bin
            apps/companion-esp32/build-${{ matrix.target }}/*.elf
            apps/companion-esp32/build-${{ matrix.target }}/bootloader/*.bin
            apps/companion-esp32/build-${{ matrix.target }}/partition_table/*.bin
            apps/companion-esp32/build-${{ matrix.target }}/flasher_args.json
          if-no-files-found: error
  waveshare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cross-build Waveshare V1.2 display and touch firmware
        run: |
          docker run --rm -v "$PWD:/project" -w /project/apps/companion-esp32 espressif/idf:v5.5.2 idf.py -B build-waveshare-lcd7 -DIDF_TARGET=esp32s3 -DSDKCONFIG=build-waveshare-lcd7/sdkconfig -DOSG_BOARD_PROFILE=waveshare-lcd7-s3 build
      - name: Stage firmware artifact for board verification
        run: python3 scripts/package-companion-firmware.py apps/companion-esp32/build-waveshare-lcd7
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-waveshare-lcd7-v1-2
          path: |
            src-tauri/resources/firmware/waveshare-lcd7-s3/
            apps/companion-esp32/build-waveshare-lcd7/*.bin
            apps/companion-esp32/build-waveshare-lcd7/*.elf
            apps/companion-esp32/build-waveshare-lcd7/bootloader/*.bin
            apps/companion-esp32/build-waveshare-lcd7/partition_table/*.bin
            apps/companion-esp32/build-waveshare-lcd7/flasher_args.json
            apps/companion-esp32/build-waveshare-lcd7/sdkconfig
          if-no-files-found: error
  sunton:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Cross-build Sunton 3.5-inch display and resistive touch firmware
        run: |
          docker run --rm -v "$PWD:/project" -w /project/apps/companion-esp32 espressif/idf:v5.5.2 idf.py -B build-sunton-3248s035r -DIDF_TARGET=esp32 -DSDKCONFIG=build-sunton-3248s035r/sdkconfig -DOSG_BOARD_PROFILE=sunton-3248s035r build
      - name: Stage firmware artifact for board verification
        run: python3 scripts/package-companion-firmware.py apps/companion-esp32/build-sunton-3248s035r
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-sunton-3248s035r
          path: |
            src-tauri/resources/firmware/sunton-3248s035r/
            apps/companion-esp32/build-sunton-3248s035r/flasher_args.json
          if-no-files-found: error
  host-wire:
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Shared embedded publication, baseline and isolated lease contract
        run: cargo test --locked --manifest-path crates/companion-service/Cargo.toml --test esp32_display
      - name: USB serial pairing, bounded delivery and connection isolation
        run: cargo test --locked --manifest-path crates/companion-serial/Cargo.toml
