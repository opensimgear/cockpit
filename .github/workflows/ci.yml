name: Cockpit checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
concurrency:
  group: cockpit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NX_NO_CLOUD: ${{ secrets.NX_CLOUD_ACCESS_TOKEN == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve last successful CI baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/baseline.mjs "${{ github.event_name == 'pull_request' && 'pull_request' || github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}"
      - name: Run all frontend checks, tests and builds for an uninitialized baseline
        if: steps.baseline.outputs.has_changes == 'true' && steps.baseline.outputs.full == 'true'
        run: pnpm exec nx run-many -t check,test,build --all --parallel=3
      - name: Run affected frontend checks, tests and builds
        if: steps.baseline.outputs.has_changes == 'true' && steps.baseline.outputs.full != 'true'
        run: pnpm exec nx affected --target=check,test,build --base="$NX_BASE" --head="$NX_HEAD" --parallel=3
