[package]
license-file = "../LICENSE"
name = "osg-cockpit"
version = "0.1.0"
description = "OpenSimGear Cockpit"
authors = ["OpenSimGear"]
edition = "2021"
rust-version = "1.90"
default-run = "osg-cockpit"

[lib]
name = "osg_cockpit"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
osg-profiles = { path = "../crates/profiles" }
osg-companion-serial = { path = "../crates/companion-serial" }
osg-companion-service = { path = "../crates/companion-service" }
osg-mapping-host = { path = "../crates/mapping-host" }
osg-virtual-controller = { path = "../crates/virtual-controller" }
osg-mapping = { path = "../crates/mapping" }
osg-controller-input = { path = "../crates/controller-input" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serialport = "4.8"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.6"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
