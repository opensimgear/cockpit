[package]
name = "osg-windows-process-smoke"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
osg-profiles = { path = "../../../crates/profiles" }

[[bin]]
name = "native-process-smoke"
path = "main.rs"

[[bin]]
name = "DCS"
path = "stub.rs"
